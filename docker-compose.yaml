services:
  backend:
    build:
      context: ./recipe-service/
      dockerfile: src/main/docker/Dockerfile.jvm
#     environment:
      # - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/test
      # - QUARKUS_DATASOURCE_USERNAME=username
      # - QUARKUS_DATASOURCE_PASSWORD=password
      # - QUARKUS_DATASOURCE_DB-KIND=postgresql
      # Hostname is the service name
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://throwaway-postgres:5432/recipe_db
      QUARKUS_DATASOURCE_USERNAME: quarkus_user
      QUARKUS_DATASOURCE_PASSWORD: quarkus_password
    restart: unless-stopped
    networks:
      - application
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.recipe-service.rule=Host(`recipe-service.sondreandersen.dev`)"
      - "traefik.http.routers.recipe-service.entrypoints=websecure"
      - "traefik.http.routers.recipe-service.tls.certresolver=le"
      - "traefik.http.services.recipe-service.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./food-web/
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.food-web.rule=Host(`food.sondreandersen.dev`)"
      - "traefik.http.routers.food-web.entrypoints=websecure"
      - "traefik.http.routers.food-web.tls.certresolver=le"
      - "traefik.http.services.food-web.loadbalancer.server.port=80"


  throwaway-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # These must match the values used by the Quarkus application below
      POSTGRES_USER: quarkus_user
      POSTGRES_PASSWORD: quarkus_password
      POSTGRES_DB: recipe_db
    networks:
      - application


networks:
  application:
    external: true

